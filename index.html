<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompraClick</title>
<style>
:root{--blue:#0b2d4d;--accent:#ff5a36;--light:#f5f7fa;--text:#17212b}
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;color:var(--text);background:#fff}
header{background:#fff;border-bottom:1px solid #e8edf2;padding:16px 20px;font-size:22px;font-weight:900;color:var(--blue)}
main{max-width:600px;margin:40px auto;padding:0 20px;text-align:center}
.product-box{border:1px solid #e5e9ee;border-radius:15px;padding:25px;background:#fff;box-shadow:0 10px 25px rgba(0,0,0,0.05)}
.pic{font-size:60px;margin-bottom:15px}
h3{font-size:20px;margin:10px 0}
.price{font-size:24px;font-weight:900;color:var(--blue);margin:15px 0}
.buy{display:block;background:var(--accent);color:white;padding:14px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:15px}
</style>
</head>
<body>

<header>Compra<span>Click</span></header>

<main>
  <div class="product-box">
    <div class="pic">📦</div>
    <h3 id="nombre">Cargando producto...</h3>
    <div class="price" id="precio">0,00 €</div>
    <a id="enlace-compra" class="buy" href="#" target="_blank">Comprar ahora</a>
  </div>
</main>

</body>
</html>
